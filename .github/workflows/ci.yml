name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lbrpit
          POSTGRES_PASSWORD: lbrpit
          POSTGRES_DB: lbrpit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lbrpit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lbrpit:lbrpit@localhost:5432/lbrpit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply schema
        run: psql "$DATABASE_URL" -f db/schema.sql

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v
