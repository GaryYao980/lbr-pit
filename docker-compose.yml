services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lbrpit
      POSTGRES_PASSWORD: lbrpit
      POSTGRES_DB: lbrpit
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lbrpit"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      DATABASE_URL: postgresql://lbrpit:lbrpit@db:5432/lbrpit
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      # source CSVs ship in ./data; mounted read-only so the ETL can read them.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
